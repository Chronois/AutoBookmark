<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoBookmark</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="header-container">
            <h1>🔖 AutoBookmark</h1>
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari link, tag, sumber...">
                <button id="openManageTagsBtn" class="btn btn-secondary">🏷️ Tags</button>
                <button id="openFilterBtn" class="btn btn-success">⚙️ Filter</button>
            </div>
        </div>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="Masukkan link web di sini..." required>
            <button id="openSelectTagsBtn" class="btn btn-outline">🏷️ Set Tag (0)</button>
            <button id="submitBtn" class="btn btn-primary">Simpan</button>
        </div>
        
        <div class="loading" id="loadingText">
            <span class="spinner"></span> Mengekstrak data...
        </div>

        <div id="bookmarkList"></div>
    </div>

    <!-- Modal Filter -->
    <div id="filterModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button id="resetFilterBtn" class="reset-btn">Reset</button>
                <button id="applyFilterBtn" class="btn btn-success">Terapkan Filter</button>
            </div>
            <div class="modal-body">
                <div class="filter-group">
                    <label>Order</label>
                    <select id="filterOrder">
                        <option value="newest">Default (Terbaru)</option>
                        <option value="oldest">Terlama</option>
                        <option value="az">A-Z</option>
                        <option value="za">Z-A</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Source</label>
                    <select id="filterSource"><option value="all">All</option></select>
                </div>
                <div class="filter-tags-group">
                    <div class="tags-header">Custom Tags</div>
                    <div id="filterTagsList" class="checkbox-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Manage Global Tags -->
    <div id="manageTagsModal" class="modal">
        <div class="modal-content manage-tags-content">
            <div class="manage-header">
                <button class="back-icon" id="closeManageTagsBtn">←</button>
                <h3>Edit categories</h3>
            </div>
            <div class="tags-list-container" id="globalTagsList"></div>
            <button id="addNewTagBtn" class="btn btn-success" style="align-self: flex-end; margin-top: 15px;">+ Add Tag</button>
        </div>
    </div>

    <!-- Modal Edit Bookmark & Set New Bookmark Tags -->
    <div id="editBookmarkModal" class="modal">
        <div class="modal-content">
            <h3 id="editModalTitle" style="margin-top:0; margin-bottom:15px; font-size:1.2rem;">Edit Bookmark</h3>
            
            <div id="editTitleGroup" style="margin-bottom:15px;">
                <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:5px;">Judul Tautan</label>
                <input type="text" id="editBmTitle" style="width:100%;" placeholder="Judul...">
            </div>
            
            <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:5px;">Pilih Custom Tags</label>
            <div class="checkbox-list" id="editBmTagsList" style="max-height: 200px; border: 1px solid #334155; padding: 10px; border-radius:8px;"></div>
            
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button id="cancelEditBtn" class="reset-btn" style="color:#ef4444;">Batal</button>
                <button id="saveEditBmBtn" class="btn btn-primary">Simpan</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM PROMPT MODAL -->
    <div id="customPromptModal" class="modal" style="z-index: 999;">
        <div class="modal-content custom-dialog">
            <h3>Pemberitahuan</h3>
            <p id="promptMessage"></p>
            <input type="text" id="promptInput" autocomplete="off">
            <div class="dialog-actions">
                <button id="promptCancel" class="btn btn-secondary">Batal</button>
                <button id="promptOk" class="btn btn-primary">Oke</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM CONFIRM MODAL -->
    <div id="customConfirmModal" class="modal" style="z-index: 999;">
        <div class="modal-content custom-dialog">
            <h3>Konfirmasi</h3>
            <p id="confirmMessage"></p>
            <div class="dialog-actions">
                <button id="confirmCancel" class="btn btn-secondary">Batal</button>
                <button id="confirmOk" class="btn btn-primary">Oke</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
