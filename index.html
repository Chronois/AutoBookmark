<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoBookmark</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Full Width -->
    <header class="navbar">
        <div class="navbar-content">
            <h1 class="app-title">🔖 AutoBookmark</h1>
        </div>
    </header>

    <!-- Konten Utama Web -->
    <main class="main-container">
        <!-- Area Kontrol Terpadu -->
        <section class="controls-section">
            <div class="control-grid">
                <input type="text" id="searchInput" class="input-field" placeholder="🔍 Cari judul, tag, atau sumber...">
                <button id="openManageTagsBtn" class="btn btn-secondary">🏷️ Tags</button>
                <button id="openFilterBtn" class="btn btn-success">⚙️ Filter</button>
            </div>
            
            <div class="control-grid">
                <input type="url" id="urlInput" class="input-field" placeholder="Masukkan link web di sini..." required>
                <button id="openSelectTagsBtn" class="btn btn-outline">🏷️ Set Tag (0)</button>
                <button id="submitBtn" class="btn btn-primary">Simpan</button>
            </div>
        </section>
        
        <div class="loading" id="loadingText">
            <span class="spinner"></span> Memproses tautan...
        </div>

        <!-- Daftar Bookmark (List View) -->
        <section class="bookmark-list-container" id="bookmarkList">
            <!-- Item akan di-generate di sini -->
        </section>
    </main>

    <!-- ================= MODALS ================= -->
    
    <!-- Modal Filter -->
    <div id="filterModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Filter Bookmark</h3>
            </div>
            <div class="modal-body">
                <div class="filter-group">
                    <label>Urutkan Berdasarkan</label>
                    <select id="filterOrder" class="input-field">
                        <option value="newest">Terbaru Ditambahkan</option>
                        <option value="oldest">Terlama Ditambahkan</option>
                        <option value="az">Alfabet (A-Z)</option>
                        <option value="za">Alfabet (Z-A)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Sumber (Source)</label>
                    <select id="filterSource" class="input-field"><option value="all">Semua Sumber</option></select>
                </div>
                <div class="filter-tags-group">
                    <label>Custom Tags</label>
                    <div id="filterTagsList" class="checkbox-list"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="resetFilterBtn" class="btn btn-ghost">Reset</button>
                <button id="applyFilterBtn" class="btn btn-primary">Terapkan Filter</button>
            </div>
        </div>
    </div>

    <!-- Modal Manage Global Tags -->
    <div id="manageTagsModal" class="modal">
        <div class="modal-content manage-tags-content">
            <div class="modal-header">
                <h3>Kelola Tags</h3>
                <button class="btn-close" id="closeManageTagsBtn">✕</button>
            </div>
            <div class="tags-list-container" id="globalTagsList"></div>
            <button id="addNewTagBtn" class="btn btn-outline" style="margin-top: 15px; width: 100%;">+ Tambah Tag Baru</button>
        </div>
    </div>

    <!-- Modal Edit Bookmark -->
    <div id="editBookmarkModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editModalTitle">Edit Bookmark</h3>
            </div>
            <div class="modal-body">
                <div id="editTitleGroup" class="filter-group">
                    <label>Judul Tautan</label>
                    <input type="text" id="editBmTitle" class="input-field" placeholder="Masukkan judul...">
                </div>
                <div class="filter-tags-group">
                    <label>Pilih Tags</label>
                    <div id="editBmTagsList" class="checkbox-list edit-tags-box"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelEditBtn" class="btn btn-ghost" style="color: #ef4444;">Batal</button>
                <button id="saveEditBmBtn" class="btn btn-primary">Simpan</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM PROMPT MODAL -->
    <div id="customPromptModal" class="modal" style="z-index: 999;">
        <div class="modal-content custom-dialog">
            <h3 class="dialog-title">Input Dibutuhkan</h3>
            <p id="promptMessage" class="dialog-msg"></p>
            <input type="text" id="promptInput" class="input-field" autocomplete="off">
            <div class="modal-footer" style="margin-top: 15px;">
                <button id="promptCancel" class="btn btn-ghost">Batal</button>
                <button id="promptOk" class="btn btn-primary">Oke</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM CONFIRM MODAL -->
    <div id="customConfirmModal" class="modal" style="z-index: 999;">
        <div class="modal-content custom-dialog">
            <h3 class="dialog-title">Konfirmasi</h3>
            <p id="confirmMessage" class="dialog-msg"></p>
            <div class="modal-footer" style="margin-top: 15px;">
                <button id="confirmCancel" class="btn btn-ghost">Batal</button>
                <button id="confirmOk" class="btn btn-primary">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
